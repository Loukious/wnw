name: Walk&Win Auto Walk Simulator

on:
  schedule:
    # Runs at 05:00 and 17:00 UTC every day
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Walk Mode (realtime = ~1h sleep walk, fast = 15s API run)'
        required: true
        default: 'realtime'
        type: choice
        options:
          - 'realtime'
          - 'fast'

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Allow up to 4 hours for real-time sleep walk execution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "walk-simulator/requirements.txt" ]; then
            pip install -r walk-simulator/requirements.txt
          fi

      - name: Run Walk Simulator
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER || secrets.WALK_WIN_PHONE || secrets.PHONE }}
          PIN_CODE: ${{ secrets.PIN_CODE || secrets.WALK_WIN_PIN || secrets.PIN }}
          WALK_MODE: ${{ inputs.mode || 'realtime' }}
        run: |
          EXTRA_FLAGS=""
          if [ "$WALK_MODE" = "fast" ]; then
            EXTRA_FLAGS="--fast"
          fi

          if [ -f "walk.py" ]; then
            python walk.py $EXTRA_FLAGS
          elif [ -f "walk-simulator/walk.py" ]; then
            cd walk-simulator && python walk.py $EXTRA_FLAGS
          fi
