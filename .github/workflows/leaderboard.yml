name: Walk&Win Leaderboard & Profile Info

on:
  schedule:
    # Runs at 20:00 UTC daily to log end-of-day rank & stats
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "walk-simulator/requirements.txt" ]; then
            pip install -r walk-simulator/requirements.txt
          fi

      - name: Fetch & Display Leaderboard Info
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER || secrets.WALK_WIN_PHONE || secrets.PHONE }}
          PIN_CODE: ${{ secrets.PIN_CODE || secrets.WALK_WIN_PIN || secrets.PIN }}
        run: |
          if [ -f "leaderboard.py" ]; then
            python leaderboard.py
          elif [ -f "walk-simulator/leaderboard.py" ]; then
            cd walk-simulator && python leaderboard.py
          fi
